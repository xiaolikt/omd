[workspace]
resolver = "2"
members = ["crates/host", "crates/transport", "crates/spike", "crates/sdk", "crates/app"]

# Windows 交叉编译用：release 级优化，但保留 debug_assertions，
# 这样 gpui-pre-windows 在运行时用 D3DCompile 编 shader，
# 不需要只在 Windows 宿主机上存在的 fxc.exe。
[profile.winrelease]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.2"

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

# 本地补丁：只为加启动耗时打点 / 验证 wgpu 各阶段成本（gpui 上游没有钩子）。
# 版本与 Cargo.lock 里的 0.3.12 一致；去掉这两行即回到 registry 版本。
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre/gpui-pre-wgpu" }
gpui-pre-linux = { path = "vendor/gpui-pre/gpui-pre-linux" }
# 本地补丁：把共享纹理拷贝的目标纹理改成按尺寸池化（CEF 每帧新建纹理太贵）。
cef = { path = "vendor/cef-rs" }
# 本地补丁：交叉编译时 shader 源码走内嵌 + 临时文件，而不是构建机的
# CARGO_MANIFEST_DIR（release 的 fxc 预编译在 Linux 上没有等价工具）。
gpui-pre-windows = { path = "vendor/gpui-pre/gpui-pre-windows" }
